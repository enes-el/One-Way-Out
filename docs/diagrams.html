<!DOCTYPE html>
<html>

<head>
  <link href="style.css" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>One Way Out</title>
</head>

<body>
  <header>
    <img src="assets/images/owo-logo-horizontal.png" alt="OWO Logo" style="max-width: 300px; width: 300px;" />
  </header>
  <div class="layout">
    <div class="table-container">
      <h3>Navigation</h3>
      <nav>
        <select onchange="window.location.href=this.value">
          <option value="">Diagrams</option>
          <option value="index.html"> Home </option>
          <option value="about.html">About</option>
          <option value="resources.html">Resources</option>
          <option value="slides.html">Slides</option>
          <option value="meet-the-team.html">Contact Us</option>
        </select>
      </nav>
    </div>
    <div class="content">
      <h1 class="page">Diagrams</h1>
      <div class="diagram">
        <h2>Requirements</h2>
        <embed src="assets/diagrams/v1_owo_requirements.pdf" alt="Requirements Diagram" style="max-width: 200%; height: 200%;" type="application/pdf"/>
      </div>
      <div class="diagram">
        <h2>Use Case Diagram</h2>
        <img src="assets/diagrams/v1_use_case.png" alt="Use Case Diagram" style="max-width: 80%; height: auto;" />
      </div>
      <div class="diagram">
        <h2>Class Diagram</h2>
        <img src="assets/diagrams/v1_class_diagram.png" alt="Class Diagram" style="max-width: 80%; height: auto;" />
      </div>
      <div class="diagram">
        <h2>Settings Sequence Diagram</h2>
        <img src="assets/diagrams/v1_settings_sequence.png" alt="Settings Sequence Diagram" style="max-width: 80%; height: auto;" />
      </div>
      <div class="diagram">
        <h2>Puzzle Sequence Diagram</h2>
        <img src="assets/diagrams/v1_puzzle_sequence.png" alt="Puzzle Sequence Diagram" style="max-width: 80%; height: auto;" />
      </div>
    </div>
  </div>


</body>

</html>
