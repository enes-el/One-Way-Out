<!DOCTYPE html> 
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>One Way Out </title>
  </head>
  <body style="background-color: white; margin: 0">
    <header style="background-color: rgb(251, 255, 0); padding: 1px 10px; text-align: center; color: white;">
    <h1 style="text-align:center">
          <img src="assets/images/OWO-Transparent-Horizontal.png" alt="OWO Logo" style="max-width:250px; width: 250px; height: auto;" />
    </h1>
    </header>
    <script type="text/javascript">
      function goToNewPage() {
        var selectElement = document.getElementById("pages");
        var selectedValue = selectElement.value;
        if (selectedValue) {
          window.location.href = selectedValue;
        }
      }
    </script>
    <header style="padding: 20px; display: flex; align-items: center;">
      <label for="Pages"> Pages </label>
      <form>
      <select name="pages" id="pages">
        <option value=""> Home </option>
        <option value="about.html">About</option>
        <option value="resources.html">Resources</option>
        <option value="diagrams.html">Diagrams</option>
        <option value="slides.html">Slides</option>
      </select>
      <input type=button value="Go" onclick="goToNewPage()">
      </form>
      <h2 style = "margin: 0;">Home</h2>
    </header>
    <p> A Point & Click Adventure Game </p>
  </body>
</html>
